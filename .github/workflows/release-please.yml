name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release-please:
    name: Update release PR or create draft
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check for an unfinished draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pending_drafts="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft) | .id')"
          if [[ -n "$pending_drafts" ]]; then
            echo "::error::A draft release is pending. Re-run failed jobs in its original Release Please workflow."
            exit 1
          fi
      - name: Create draft release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      # A draft has no tag yet, so defer PR generation until it is published.
      - name: Update release PR
        if: steps.release.outputs.release_created != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT runs release PR CI without manual approval; GITHUB_TOKEN needs no secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  release-checks:
    name: Release CI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}

  upload-package:
    name: Attach package and publish release
    needs: [release-please, release-checks]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pack plugin
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      # Keep this in the same workflow: tags made with GITHUB_TOKEN do not start workflows.
      - name: Upload package and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.tgz --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  publish-npm:
    name: Publish to npm
    needs: [release-please, release-checks, upload-package]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Provenance and npm Trusted Publishing both exchange this OIDC token.
      id-token: write
    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish to npm
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "::error::package.json is $version but the release tag is $RELEASE_TAG."
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          # No NPM_TOKEN means a trusted publisher configured on npmjs.com publishes via OIDC.
          if [[ -n "$NPM_TOKEN" ]]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          fi
          npm publish --provenance --access public
