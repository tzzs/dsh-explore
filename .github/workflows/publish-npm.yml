name: Publish npm

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to publish; defaults to the branch chosen in the Actions UI.
        required: false
        type: string
        default: ''
      dry_run:
        description: Only run npm publish --dry-run, without publishing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  publish:
    name: Publish to npm
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Provenance and npm Trusted Publishing both exchange this OIDC token.
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "Selected $name@$version"
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --dry-run --access public
            exit 0
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          # No NPM_TOKEN means a trusted publisher configured on npmjs.com publishes via OIDC.
          if [[ -n "$NPM_TOKEN" ]]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          fi
          npm publish --provenance --access public
